<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e38"/>
      <stop offset="100%" stop-color="#181b22"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48b0f7"/>
      <stop offset="70%" stop-color="#00c853"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Drive Case -->
  <rect x="14" y="20" width="100" height="88" rx="14" fill="url(#bodyGrad)" stroke="#3e4452" stroke-width="3"/>

  <!-- Top Plate Inset -->
  <rect x="22" y="28" width="84" height="48" rx="8" fill="#13151a" stroke="#2c303c" stroke-width="2"/>

  <!-- Platter Circle / Chip -->
  <circle cx="50" cy="52" r="18" fill="none" stroke="#48b0f7" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.8"/>
  <circle cx="50" cy="52" r="6" fill="#48b0f7"/>

  <!-- Activity LED -->
  <circle cx="92" cy="38" r="4" fill="#00e676" filter="url(#glow)"/>

  <!-- Usage Bar Track -->
  <rect x="22" y="86" width="84" height="10" rx="5" fill="#20242c"/>

  <!-- Usage Bar Fill (e.g. 75% full) -->
  <rect x="22" y="86" width="63" height="10" rx="5" fill="url(#barGrad)"/>

  <!-- Mounting Screws -->
  <circle cx="20" cy="26" r="2.5" fill="#505666"/>
  <circle cx="108" cy="26" r="2.5" fill="#505666"/>
  <circle cx="20" cy="102" r="2.5" fill="#505666"/>
  <circle cx="108" cy="102" r="2.5" fill="#505666"/>
</svg>
